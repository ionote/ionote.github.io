<style>
:root{
  --bg:#F8F8FA;--surface:#fff;--fg:#15151A;--mut:#8B8B96;--line:#E8E8ED;--track:#D4D4DC;--seg:#fff;
  --acc:#4F46E5;--on-acc:#fff;--danger:#D92D20;
  --st:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));
  --sb:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px));
  --sl:max(env(safe-area-inset-left,0px),var(--safe-area-inset-left,0px));
  --sr:max(env(safe-area-inset-right,0px),var(--safe-area-inset-right,0px));
  color-scheme:light
}
[data-theme=dark]{--bg:#0D0D11;--surface:#17171C;--fg:#F4F4F6;--mut:#8C8C98;--line:#25252C;--track:#3A3A44;--seg:#3A3A44;--acc:#8B90FF;--on-acc:#0D0D11;--danger:#F97066;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--fg);font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;-webkit-font-smoothing:antialiased;padding:0 var(--sr) 0 var(--sl)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
input,textarea{background:none;border:0;outline:0;width:100%}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;transition:background .15s}
.ib:active{background:var(--line)}

#dock{position:fixed;left:calc(16px + var(--sl));bottom:calc(24px + var(--sb));z-index:20;display:flex;gap:8px}
#dock .ib{width:50px;height:50px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}

#list{max-width:680px;margin:0 auto;padding:calc(var(--st) + 20px) 16px calc(var(--sb) + 110px);display:grid;gap:10px}
.note{display:block;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;transition:transform .12s}
.note:active{transform:scale(.985)}
.nt{display:block;font-weight:600;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.np{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px;color:var(--mut);font-size:14px;line-height:1.45}
.nm{display:flex;align-items:center;gap:6px;margin-top:10px;color:var(--mut);font-size:12px}
.nm .ic{width:13px;height:13px;color:var(--acc);fill:var(--acc)}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;margin-top:18vh;color:var(--mut)}
.empty .ic{width:46px;height:46px;stroke-width:1.2;margin-bottom:8px}
.empty b{color:var(--fg);font-size:17px}

#add{position:fixed;right:calc(20px + var(--sr));bottom:calc(20px + var(--sb));z-index:20;width:58px;height:58px;border-radius:20px;display:grid;place-items:center;background:var(--acc);color:var(--on-acc);box-shadow:0 8px 24px color-mix(in srgb,var(--acc) 40%,transparent);transition:transform .15s}
#add:active{transform:scale(.94)}
#add .ic{width:26px;height:26px;stroke-width:2.2}

.page{position:fixed;inset:0;z-index:50;background:var(--bg);transform:translateX(100%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}
.page.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.col{max-width:680px;height:100%;margin:0 auto;padding:0 16px;display:flex;flex-direction:column}
.pbar{display:flex;align-items:center;gap:2px;padding:calc(var(--st) + 8px) 0 8px;margin:0 -8px}
.stamp{flex:1;text-align:center;color:var(--mut);font-size:13px}
#btnPin[aria-pressed=true]{color:var(--acc)}
#btnPin[aria-pressed=true] .ic{fill:var(--acc)}
#t{font-size:26px;font-weight:700;line-height:1.25;padding:8px 0 4px;letter-spacing:-.01em}
#b{flex:1;min-height:0;resize:none;font-size:17px;line-height:1.65;padding:8px 0 calc(var(--sb) + 16px)}
::placeholder{color:var(--mut);opacity:.7}

.pbody{flex:1;overflow-y:auto;padding:8px 0 calc(var(--sb) + 32px)}
.pbody>*+*{margin-top:14px}
.pbar h2{margin:0 0 0 6px;font-size:20px;font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;min-height:54px;padding:14px 16px;text-align:start}
.row+.row{border-top:1px solid var(--line)}
.row b{display:block;font-weight:500}
.row small{display:block;margin-top:2px;color:var(--mut);font-size:13px;line-height:1.35}
.row.danger{color:var(--danger)}
.row:active{background:var(--bg)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--line);border-radius:14px}
.seg button{height:40px;border-radius:10px;color:var(--mut);font-size:14px;font-weight:500;transition:background .15s,color .15s}
.seg button[aria-pressed=true]{background:var(--seg);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.toggle{width:50px;height:30px;border-radius:15px;background:var(--track);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.toggle.on{background:var(--acc)}
.toggle.on::after{transform:translateX(20px)}
select{appearance:none;-webkit-appearance:none;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}

#lock{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--bg)}
#lock.show{display:flex}
.badge{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;margin-bottom:20px;color:var(--acc);background:var(--surface);border:1px solid var(--line)}
#lock h2{margin:0 0 8px;font-size:22px;font-weight:700}
#lock p{margin:0 0 22px;color:var(--mut);font-size:14px;max-width:300px;line-height:1.5}
#lock #lockErr{margin:0 0 8px;min-height:18px;color:var(--danger);font-size:13px}
.field{width:100%;max-width:320px;height:50px;padding:0 16px;margin-bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;font-size:16px}
.field:focus{border-color:var(--acc);outline:0}
.btn{width:100%;max-width:320px;height:50px;border-radius:14px;background:var(--acc);color:var(--on-acc);font-weight:600;font-size:16px}
.btn:disabled{opacity:.6}
.link{margin-top:6px;height:44px;padding:0 16px;color:var(--mut);font-size:15px}

#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 92px);z-index:300;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);padding:12px 16px;border-radius:14px;background:var(--fg);color:var(--bg);font-size:14px;opacity:0;pointer-events:none;transform:translate(-50%,10px);transition:opacity .2s,transform .2s}
#toast.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
#toast button{color:var(--acc);font-weight:700}

#installGuide{position:fixed;inset:0;z-index:150;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
#installGuide.show{opacity:1;visibility:visible;transition:opacity .2s}
.sheet{width:100%;max-width:520px;padding:22px 22px calc(var(--sb) + 22px);background:var(--surface);border-radius:24px 24px 0 0;transform:translateY(24px);transition:transform .25s}
#installGuide.show .sheet{transform:none}
.sheet h3{margin:0 0 6px;font-size:19px}
.sheet ol{margin:10px 0 20px;padding-left:20px;font-size:15px;line-height:1.65}
.sheet li{margin-bottom:4px}
.sheet .btn{max-width:none}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important}}
</style>
</head>

<div id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastAct" hidden></button></div>

<script>
(() => {
"use strict";

const STORE_KEY = "notes_v3_enc";
const SETTINGS_KEY = "notes_settings_v3";
const ITER = 600000;
const CHECK = "ionote";

const $ = s => document.querySelector(s);
const te = new TextEncoder();
const td = new TextDecoder();

/* ── Crypto: AES-GCM, key from passphrase via PBKDF2 ── */
function b64(buf) {
  const bytes = buf instanceof ArrayBuffer ? new Uint8Array(buf) : buf;
  let s = "";
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s);
}
function fromB64(str) {
  const bin = atob(str);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function deriveKey(pass, salt, iter = ITER) {
  const base = await crypto.subtle.importKey("raw", te.encode(pass.normalize("NFKC")), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" },
    base,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}

async function encryptText(plain, key) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, te.encode(plain));
  return b64(iv) + ":" + b64(ct);
}

async function decryptText(payload, key) {
  const [ivB, ctB] = payload.split(":");
  if (!ivB || !ctB) throw new Error("bad payload");
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(ivB) }, key, fromB64(ctB));
  return td.decode(pt);
}

async function checkKey(key, check) {
  try { return (await decryptText(check, key)) === CHECK; } catch { return false; }
}

async function decryptItems(items, key) {
  const out = [];
  for (const n of items) {
    try {
      out.push({ id: n.id, d: n.d, pinned: !!n.pinned, t: await decryptText(n.t, key), b: await decryptText(n.b, key) });
    } catch {}
  }
  return out;
}

/* ── Storage ── */
function loadRaw(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch { return fallback; }
}
function saveRaw(key, data) {
  try { localStorage.setItem(key, JSON.stringify(data)); }
  catch { toast("Could not save, storage is full"); }
}

let settings = {
  theme: "system", autoLock: 5, lockEnabled: false, salt: null, iter: null, check: null, noticeSeen: false,
  ...loadRaw(SETTINGS_KEY, {})
};

let notes = [];          // plaintext in memory only while unlocked
let cryptoKey = null;    // AES key while unlocked
let cur = null;
let saveTimer = null;
let lockMode = "unlock";
let importData = null;
let hiddenAt = 0;
let holdLock = 0;
let deferredPrompt = null;
let toastTimer = null;

const list = $("#list");
const ed = $("#ed");

const uid = () => crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const fmtDate = d => {
  const now = new Date(), dt = new Date(d), diff = (now - dt) / 864e5;
  if (diff < 1 && now.getDate() === dt.getDate()) return dt.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
  if (diff < 2) return "Yesterday";
  if (diff < 7) return dt.toLocaleDateString(undefined, { weekday: "long" });
  return dt.toLocaleDateString(undefined, { month: "short", day: "numeric", year: now.getFullYear() !== dt.getFullYear() ? "numeric" : undefined });
};

/* ── Toast ── */
function hideToast() { $("#toast").classList.remove("show"); }
function toast(msg, act, fn, ms = 2600) {
  $("#toastMsg").textContent = msg;
  const b = $("#toastAct");
  b.hidden = !act;
  b.textContent = act || "";
  b.onclick = () => { hideToast(); if (fn) fn(); };
  $("#toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, act ? 5000 : ms);
}

/* ── Theme ── */
const mq = matchMedia("(prefers-color-scheme: dark)");
function applyTheme() {
  const dark = settings.theme === "dark" || (settings.theme === "system" && mq.matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $("#metaTheme").content = dark ? "#0D0D11" : "#F8F8FA";
  document.querySelectorAll("#seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === settings.theme)));
}
mq.addEventListener("change", applyTheme);

/* ── Persist ── */
async function persistNotes() {
  if (settings.lockEnabled && !cryptoKey) return;
  if (settings.lockEnabled) {
    const packed = [];
    for (const n of notes) {
      packed.push({
        id: n.id,
        d: n.d,
        pinned: !!n.pinned,
        t: await encryptText(n.t || "", cryptoKey),
        b: await encryptText(n.b || "", cryptoKey)
      });
    }
    saveRaw(STORE_KEY, { enc: true, items: packed });
  } else {
    saveRaw(STORE_KEY, { enc: false, items: notes.map(n => ({ id: n.id, t: n.t, b: n.b, d: n.d, pinned: !!n.pinned })) });
  }
}

async function loadNotes() {
  const data = loadRaw(STORE_KEY, { enc: false, items: [] });
  if (!Array.isArray(data.items)) return [];
  if (!data.enc) return data.items.map(n => ({ id: n.id, t: n.t || "", b: n.b || "", d: n.d || Date.now(), pinned: !!n.pinned }));
  return cryptoKey ? decryptItems(data.items, cryptoKey) : null;
}

/* ── List ── */
function render() {
  const items = [...notes].sort((a, b) => (b.pinned - a.pinned) || (b.d - a.d));

  if (!items.length) {
    list.innerHTML = `<div class="empty"><svg class="ic"><use href="#i-note"/></svg><b>No notes yet</b><span>Tap + to write your first note</span></div>`;
    return;
  }
  list.innerHTML = items.map(n => {
    const lines = n.b.trim().split("\n");
    const title = n.t.trim() || lines[0] || "Untitled";
    const preview = (n.t.trim() ? lines : lines.slice(1)).join(" ").trim().slice(0, 200);
    return `<button class="note" data-id="${esc(n.id)}"><span class="nt" dir="auto">${esc(title)}</span>${preview ? `<span class="np" dir="auto">${esc(preview)}</span>` : ""}<span class="nm">${n.pinned ? '<svg class="ic"><use href="#i-pin"/></svg>' : ""}<span>${fmtDate(n.d)}</span></span></button>`;
  }).join("");
}

/* ── Editor ── */
function pinUI() { $("#btnPin").setAttribute("aria-pressed", String(!!(cur && cur.pinned))); }
function stampUI() { $("#stamp").textContent = cur && (cur.t || cur.b) ? "Edited " + fmtDate(cur.d) : "New note"; }

function openNote(n) {
  cur = n;
  $("#t").value = n.t;
  $("#b").value = n.b;
  pinUI();
  stampUI();
  ed.classList.add("open");
  history.pushState({ v: "ed" }, "");
}

function closeNote() {
  clearTimeout(saveTimer);
  ed.classList.remove("open");
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (cur && !cur.t.trim() && !cur.b.trim()) notes = notes.filter(x => x !== cur);
  cur = null;
  persistNotes();
  render();
}

function scheduleSave() {
  if (!cur) return;
  cur.t = $("#t").value;
  cur.b = $("#b").value;
  cur.d = Date.now();
  stampUI();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistNotes, 400);
}

async function togglePin() {
  if (!cur) return;
  cur.pinned = !cur.pinned;
  cur.d = Date.now();
  const on = cur.pinned;
  pinUI();
  stampUI();
  await persistNotes();
  toast(on ? "Pinned" : "Unpinned");
}

async function deleteCurrent() {
  if (!cur) return;
  const n = cur, i = notes.indexOf(n);
  notes.splice(i, 1);
  cur = null;
  clearTimeout(saveTimer);
  await persistNotes();
  history.back();
  toast("Note deleted", "Undo", async () => {
    notes.splice(Math.min(i, notes.length), 0, n);
    await persistNotes();
    render();
  });
}

/* ── Lock ── */
const LOCK_UI = {
  unlock: { t: "Notes are locked", p: "Enter your passphrase to open them.", ok: "Unlock", two: false, cancel: false, input: true },
  set: { t: "Encrypt notes", p: "Choose a passphrase of at least 12 characters. If you forget it, your notes cannot be recovered.", ok: "Encrypt", two: true, cancel: true, input: true },
  change: { t: "Change passphrase", p: "Choose a new passphrase of at least 12 characters. If you forget it, your notes cannot be recovered.", ok: "Change", two: true, cancel: true, input: true },
  import: { t: "Encrypted backup", p: "Enter the passphrase this backup was made with.", ok: "Import", two: false, cancel: true, input: true },
  legacy: { t: "Old lock format", p: "These notes were locked with a PIN by an older version and can't be opened here. Erase them to start fresh.", ok: "Erase old notes", two: false, cancel: false, input: false }
};

function showLock(mode) {
  lockMode = mode;
  const u = LOCK_UI[mode];
  $("#lockTitle").textContent = u.t;
  $("#lockText").textContent = u.p;
  $("#lockOk").textContent = u.ok;
  $("#lockPass").style.display = u.input ? "" : "none";
  $("#lockPass2").style.display = u.two ? "" : "none";
  $("#lockCancel").style.display = u.cancel ? "" : "none";
  $("#lockPass").value = "";
  $("#lockPass2").value = "";
  $("#lockErr").textContent = "";
  $("#lock").classList.add("show");
  if (u.input) $("#lockPass").focus();
}

function hideLock() {
  $("#lockPass").value = "";
  $("#lockPass2").value = "";
  $("#lock").classList.remove("show");
}

function refreshSecurityUI() {
  const on = settings.lockEnabled && !!settings.check;
  $("#togLock .toggle").classList.toggle("on", on);
  $("#togLock").setAttribute("aria-checked", String(on));
  ["#rowAuto", "#btnChangePass", "#btnLock"].forEach(s => { $(s).hidden = !on; });
  $("#selAuto").value = String(settings.autoLock);
}

async function submitLock() {
  const pass = $("#lockPass").value;
  const fail = m => { $("#lockErr").textContent = m; };
  $("#lockOk").disabled = true;
  try {
    if (lockMode === "legacy") {
      if (!confirm("Erase the old locked notes permanently?")) return;
      localStorage.removeItem(STORE_KEY);
      Object.assign(settings, { lockEnabled: false, salt: null, iter: null, check: null });
      delete settings.pinHash;
      saveRaw(SETTINGS_KEY, settings);
      notes = [];
      refreshSecurityUI();
      hideLock();
      render();
      return;
    }
    if (lockMode === "unlock") {
      const key = await deriveKey(pass, fromB64(settings.salt), settings.iter);
      if (!(await checkKey(key, settings.check))) return fail("Wrong passphrase");
      cryptoKey = key;
      notes = (await loadNotes()) || [];
      hideLock();
      render();
      return;
    }
    if (lockMode === "import") {
      const d = importData;
      const key = await deriveKey(pass, fromB64(d.salt), d.iter);
      if (!(await checkKey(key, d.check))) return fail("Wrong passphrase");
      const items = await decryptItems(d.items, key);
      importData = null;
      hideLock();
      await mergeNotes(items);
      return;
    }
    if (pass.length < 12) return fail("Use at least 12 characters");
    if (pass !== $("#lockPass2").value) return fail("Passphrases don't match");
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const key = await deriveKey(pass, salt);
    settings.salt = b64(salt);
    settings.iter = ITER;
    settings.check = await encryptText(CHECK, key);
    settings.lockEnabled = true;
    cryptoKey = key;
    saveRaw(SETTINGS_KEY, settings);
    await persistNotes();
    refreshSecurityUI();
    hideLock();
    toast(lockMode === "set" ? "Encryption on" : "Passphrase changed");
  } catch {
    fail("Something went wrong");
  } finally {
    $("#lockOk").disabled = false;
  }
}

async function lockApp() {
  if (!settings.lockEnabled || !cryptoKey) return;
  clearTimeout(saveTimer);
  if (cur && !cur.t.trim() && !cur.b.trim()) notes = notes.filter(x => x !== cur);
  await persistNotes();
  cryptoKey = null;
  notes = [];
  cur = null;
  importData = null;
  $("#t").value = "";
  $("#b").value = "";
  ed.classList.remove("open");
  $("#settings").classList.remove("open");
  $("#installGuide").classList.remove("show");
  hideToast();
  list.innerHTML = "";
  showLock("unlock");
}

/* ── Backup ── */
async function mergeNotes(items) {
  let added = 0, updated = 0;
  for (const n of items) {
    const have = notes.find(x => x.id === n.id);
    if (!have) { notes.unshift(n); added++; }
    else if (n.d > have.d) { Object.assign(have, n); updated++; }
  }
  await persistNotes();
  render();
  toast(`Imported ${added} new, ${updated} updated`);
}

const clean = arr => arr
  .filter(n => n && typeof n === "object")
  .map(n => ({
    id: String(n.id || uid()),
    t: String(n.t ?? n.title ?? ""),
    b: String(n.b ?? n.body ?? n.content ?? ""),
    d: Number(n.d ?? n.date) || Date.now(),
    pinned: !!n.pinned
  }));

async function backupFile() {
  await persistNotes();
  const out = settings.lockEnabled
    ? { app: "ionote", v: 1, enc: true, salt: settings.salt, iter: settings.iter, check: settings.check, items: loadRaw(STORE_KEY, { items: [] }).items }
    : { app: "ionote", v: 1, enc: false, items: notes.map(n => ({ id: n.id, t: n.t, b: n.b, d: n.d, pinned: !!n.pinned })) };
  return new File([JSON.stringify(out)], `ionote-backup-${new Date().toISOString().slice(0, 10)}.json`, { type: "application/json" });
}

/* ── Install ── */
function isStandalone() {
  return matchMedia("(display-mode: standalone)").matches
    || navigator.standalone === true
    || document.referrer.includes("android-app://");
}

function getPlatform() {
  const ua = navigator.userAgent || "";
  if (/iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) return "ios";
  if (/Android/i.test(ua)) return "android";
  return "desktop";
}

function showInstallGuide() {
  const ua = navigator.userAgent || "";
  const p = getPlatform();
  let s;
  if (p === "ios") {
    s = ["Open the <b>Share</b> menu", "Tap <b>Add to Home Screen</b>", "Tap <b>Add</b>"];
  } else if (p === "android") {
    const other = /Firefox|EdgA|OPR|Opera|SamsungBrowser/.test(ua) || navigator.brave;
    s = other
      ? ["This browser can only add a shortcut, not a real app", "Open this page in <b>Chrome</b> and follow the install steps there"]
      : ["Use the page for 30 seconds and tap once", "Tap <b>⋮</b>, then <b>Install and create shortcut</b>", "Tap <b>Install</b>, not <b>Create shortcut</b>", "If <b>Install</b> is greyed out, this phone can't install apps from Chrome (it needs Google Play Services and Play Store access)"];
  } else if (/Firefox/.test(ua)) {
    s = ["Firefox on desktop can't install web apps", "Open this page in <b>Chrome</b> or <b>Edge</b>"];
  } else if (/^((?!chrome|android).)*safari/i.test(ua)) {
    s = ["In Safari, choose <b>File</b>, then <b>Add to Dock</b>"];
  } else {
    s = ["Click the <b>install icon</b> in the address bar", "Or open the browser menu and choose <b>Install ioNote</b>"];
  }
  $("#guideSteps").innerHTML = s.map(x => `<li>${x}</li>`).join("");
  $("#installGuide").classList.add("show");
}

async function triggerInstall() {
  if (deferredPrompt) {
    try {
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
    } catch {}
    deferredPrompt = null;
    return;
  }
  showInstallGuide();
}

addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; });
addEventListener("appinstalled", () => { deferredPrompt = null; $("#btnInstall").hidden = true; toast("App installed"); });

/* ── Events ── */
$("#add").onclick = () => {
  const n = { id: uid(), t: "", b: "", d: Date.now(), pinned: false };
  notes.unshift(n);
  openNote(n);
  setTimeout(() => $("#t").focus(), 300);
};
list.onclick = e => {
  const el = e.target.closest(".note");
  const n = el && notes.find(x => x.id === el.dataset.id);
  if (n) openNote(n);
};

$("#t").oninput = scheduleSave;
$("#b").oninput = scheduleSave;
$("#t").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); $("#b").focus(); } };
$("#back").onclick = () => history.back();
$("#btnPin").onclick = togglePin;
$("#btnDel").onclick = deleteCurrent;

$("#btnSettings").onclick = () => { $("#settings").classList.add("open"); history.pushState({ v: "set" }, ""); };
$("#setBack").onclick = () => history.back();
$("#btnLock").onclick = lockApp;

$("#seg").onclick = e => {
  const b = e.target.closest("button");
  if (!b) return;
  settings.theme = b.dataset.v;
  saveRaw(SETTINGS_KEY, settings);
  applyTheme();
};

$("#togLock").onclick = async () => {
  if (!settings.lockEnabled) { showLock("set"); return; }
  if (!confirm("Turn off encryption? Notes will be stored unencrypted.")) return;
  Object.assign(settings, { lockEnabled: false, salt: null, iter: null, check: null });
  cryptoKey = null;
  saveRaw(SETTINGS_KEY, settings);
  await persistNotes();
  refreshSecurityUI();
  toast("Encryption off");
};
$("#btnChangePass").onclick = () => showLock("change");
$("#selAuto").onchange = e => { settings.autoLock = Number(e.target.value); saveRaw(SETTINGS_KEY, settings); };

$("#lockOk").onclick = submitLock;
$("#lockCancel").onclick = () => { importData = null; hideLock(); };
$("#lock").addEventListener("keydown", e => { if (e.key === "Enter") submitLock(); });

$("#btnExport").onclick = async () => {
  const f = await backupFile();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(f);
  a.download = f.name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("Backup saved");
};

$("#btnImport").onclick = () => { holdLock = Date.now() + 120000; $("#importFile").click(); };
$("#importFile").onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      if (Array.isArray(data)) await mergeNotes(clean(data));
      else if (!Array.isArray(data.items)) throw new Error("invalid");
      else if (!data.enc) await mergeNotes(clean(data.items));
      else if (!data.salt || !data.iter || !data.check) throw new Error("invalid");
      else { importData = data; showLock("import"); }
    } catch { toast("Invalid file"); }
    e.target.value = "";
  };
  reader.readAsText(file);
};

$("#btnInstall").onclick = triggerInstall;
$("#guideClose").onclick = () => $("#installGuide").classList.remove("show");
$("#installGuide").onclick = e => { if (e.target === $("#installGuide")) $("#installGuide").classList.remove("show"); };

$("#btnClearAll").onclick = async () => {
  if (!confirm("Delete all notes permanently? This can't be undone.")) return;
  notes = [];
  await persistNotes();
  render();
  history.back();
  toast("All notes deleted");
};

addEventListener("popstate", () => {
  if (ed.classList.contains("open")) closeNote();
  $("#settings").classList.remove("open");
  $("#installGuide").classList.remove("show");
});

addEventListener("keydown", e => {
  if (e.key === "Escape" && (ed.classList.contains("open") || $("#settings").classList.contains("open"))) history.back();
});

document.addEventListener("visibilitychange", () => {
  if (Date.now() < holdLock) return;
  if (document.hidden) {
    hiddenAt = Date.now();
    if (settings.autoLock === 0) lockApp();
    return;
  }
  if (hiddenAt && settings.lockEnabled && cryptoKey && Date.now() - hiddenAt >= settings.autoLock * 60000) lockApp();
  hiddenAt = 0;
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

/* ── Init ── */
(async () => {
  applyTheme();
  refreshSecurityUI();
  $("#btnInstall").hidden = isStandalone();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

  if (settings.lockEnabled) {
    showLock(settings.check ? "unlock" : "legacy");
    return;
  }
  notes = (await loadNotes()) || [];
  render();
  if (!settings.noticeSeen) {
    settings.noticeSeen = true;
    saveRaw(SETTINGS_KEY, settings);
    toast("Notes stay on this device. You can encrypt them in Settings.", null, null, 6000);
  }
})();
})();
</script>
</body>
</html>
