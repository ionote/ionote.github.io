<!doctype html>
<html lang="en" dir="ltr" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141614" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f8f7f4" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ioNote">
<meta name="description" content="ioNote: a simple, fast, private notes app that works fully offline">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'">
<title>ioNote</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root {
  color-scheme: light;
  --bg: #f8f7f4;
  --fg: #1c1e1c;
  --mut: #8b908c;
  --line: #e6e4df;
  --card: #ffffff;
  --card-hover: #faf9f6;
  --acc: #c45c32;
  --acc-soft: #f6ebe5;
  --danger: #c04040;
  --success: #2f7a5e;
  --radius: 14px;
  --st: max(env(safe-area-inset-top, 0px), 12px);
  --sb: max(env(safe-area-inset-bottom, 0px), 12px);
  --sl: max(env(safe-area-inset-left, 0px), 0px);
  --sr: max(env(safe-area-inset-right, 0px), 0px);
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --ease: cubic-bezier(.25, 1, .5, 1);
}

[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141614;
  --fg: #eceeea;
  --mut: #919991;
  --line: #282c29;
  --card: #1c201e;
  --card-hover: #232826;
  --acc: #e08a62;
  --acc-soft: #352820;
  --danger: #e87070;
  --success: #7ec4a4;
}

@media (prefers-color-scheme: dark) {
  [data-theme="system"] {
    color-scheme: dark;
    --bg: #141614;
    --fg: #eceeea;
    --mut: #919991;
    --line: #282c29;
    --card: #1c201e;
    --card-hover: #232826;
    --acc: #e08a62;
    --acc-soft: #352820;
    --danger: #e87070;
    --success: #7ec4a4;
  }
}

*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.5 var(--font);
  padding: 0 var(--sr) 0 var(--sl);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

input, textarea, button, select { font: inherit; color: inherit; }
input, textarea { background: none; border: 0; outline: 0; width: 100%; resize: none; }
button {
  border: 0;
  background: none;
  cursor: pointer;
  min-width: 42px;
  min-height: 42px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 11px;
  transition: background .15s, transform .12s, opacity .15s;
  -webkit-user-select: none;
  user-select: none;
}
button:active { transform: scale(.96); }
button:disabled { opacity: .4; pointer-events: none; }

/* ── Header ── */
.header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  padding: calc(var(--st) + 14px) 20px 12px;
  border-bottom: 1px solid transparent;
  transition: border-color .2s;
}
.header.scrolled { border-bottom-color: var(--line); }
.header-inner, .toolbar, #list { width: min(100%, 680px); margin-inline: auto; }
.header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: var(--acc);
  color: #fff;
}
.brand-mark svg { width: 18px; height: 18px; }
.header h1 {
  margin: 0;
  font-size: 18px;
  font-weight: 650;
  letter-spacing: -.03em;
}
.header-actions { display: flex; gap: 4px; }
.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  color: var(--fg);
}
.icon-btn:hover { background: var(--card); }
.icon-btn svg { width: 18px; height: 18px; }

/* Search */
.search-wrap { margin-top: 16px; position: relative; }
.search-wrap input {
  height: 44px;
  padding: 0 40px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  transition: border-color .15s;
}
.search-wrap input:focus { border-color: color-mix(in srgb, var(--acc) 50%, var(--line)); }
.search-wrap input::placeholder { color: var(--mut); }
.search-icon {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--mut);
  pointer-events: none;
}
.search-icon svg { width: 16px; height: 16px; }
.search-clear {
  position: absolute;
  right: 4px;
  top: 50%;
  transform: translateY(-50%);
  width: 34px;
  height: 34px;
  color: var(--mut);
  display: none;
}
.search-wrap.has-query .search-clear { display: flex; }

/* Toolbar */
.toolbar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 12px 20px 6px;
}
.chip {
  flex-shrink: 0;
  height: 32px;
  padding: 0 12px;
  border-radius: 8px;
  background: transparent;
  color: var(--mut);
  font-size: 13px;
  font-weight: 550;
  border: 1px solid transparent;
}
.chip.active {
  background: var(--acc-soft);
  color: var(--acc);
}
.chip:hover:not(.active) { background: var(--card); }
.count {
  margin-left: auto;
  font-size: 12px;
  color: var(--mut);
  white-space: nowrap;
}

/* Notes list */
#list {
  padding: 6px 20px calc(var(--sb) + 90px);
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
}
.note {
  background: var(--card);
  padding: 14px 16px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
  transition: border-color .15s, background .15s;
  animation: fadeUp .25s var(--ease) both;
}
.note:active { transform: scale(.99); }
.note:hover {
  border-color: color-mix(in srgb, var(--acc) 25%, var(--line));
  background: var(--card-hover);
}
.note.pinned { border-color: color-mix(in srgb, var(--acc) 35%, var(--line)); }
.note-title {
  display: block;
  font-weight: 600;
  font-size: 14.5px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  margin-bottom: 3px;
  letter-spacing: -.01em;
}
.note-preview {
  margin: 0;
  color: var(--mut);
  font-size: 13px;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  line-height: 1.5;
}
.note-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
  font-size: 11px;
  color: var(--mut);
}
.pin-indicator { color: var(--acc); font-weight: 600; }

/* Empty state */
#empty {
  text-align: center;
  color: var(--mut);
  padding: 18vh 24px 0;
  animation: fadeUp .3s var(--ease);
}
#empty .empty-icon {
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  margin: 0 auto 16px;
  border-radius: 14px;
  background: var(--acc-soft);
  color: var(--acc);
}
#empty svg { width: 24px; height: 24px; }
#empty p {
  margin: 0 0 4px;
  font-size: 16px;
  font-weight: 600;
  color: var(--fg);
}
#empty span { font-size: 13px; }

/* FAB */
.fab {
  position: fixed;
  right: calc(var(--sr) + 18px);
  bottom: calc(var(--sb) + 18px);
  width: 52px;
  height: 52px;
  border-radius: 14px;
  background: var(--acc);
  color: #fff;
  z-index: 30;
  box-shadow: 0 4px 16px color-mix(in srgb, var(--acc) 28%, transparent);
  transition: transform .18s var(--ease);
}
.fab:hover { transform: translateY(-1px); }
.fab:active { transform: scale(.96); }
.fab svg { width: 22px; height: 22px; }
.fab span { display: none; }

/* Editor */
#ed {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  z-index: 50;
  transform: translateX(105%);
  transition: transform .28s var(--ease);
  padding: calc(var(--st) + 4px) 0 0;
}
#ed.open { transform: translateX(0); }
.ed-header {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px max(16px, calc((100vw - 640px) / 2)) 10px;
  border-bottom: 1px solid var(--line);
}
.ed-header button { color: var(--mut); }
.ed-header button:hover { color: var(--fg); background: var(--card); }
.ed-header .save-status {
  margin-left: auto;
  font-size: 12px;
  color: var(--mut);
  transition: color .2s;
}
.ed-header .save-status.saved { color: var(--success); }
.ed-header .save-status.saving { color: var(--acc); }
#t, #b { width: min(100%, 640px); margin-inline: auto; }
#t {
  font-size: clamp(24px, 4.5vw, 30px);
  font-weight: 680;
  padding: 24px 20px 8px;
  letter-spacing: -.035em;
}
#t::placeholder { color: color-mix(in srgb, var(--mut) 65%, transparent); }
#b {
  flex: 1;
  padding: 8px 20px 24px;
  line-height: 1.75;
  font-size: 15.5px;
  overflow-y: auto;
}
#b::placeholder { color: color-mix(in srgb, var(--mut) 70%, transparent); }
.ed-footer {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px max(16px, calc((100vw - 640px) / 2)) calc(var(--sb) + 8px);
  border-top: 1px solid var(--line);
  background: var(--bg);
}
.ed-footer .word-count {
  margin-right: auto;
  font-size: 11px;
  color: var(--mut);
}
.ed-footer button {
  height: 36px;
  padding: 0 12px;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 550;
}
.btn-danger { color: var(--danger); }
.btn-danger:hover { background: color-mix(in srgb, var(--danger) 9%, transparent); }

/* Lock screen */
#lock {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: var(--bg);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 28px;
  text-align: center;
}
#lock.show { display: flex; }
#lock svg {
  width: 40px;
  height: 40px;
  color: var(--acc);
  margin-bottom: 20px;
}
#lock h2 {
  margin: 0 0 8px;
  font-size: 20px;
  font-weight: 650;
  letter-spacing: -.02em;
}
#lock p {
  margin: 0 0 24px;
  color: var(--mut);
  font-size: 14px;
  max-width: 280px;
  line-height: 1.5;
}
#lock input {
  width: min(100%, 280px);
  height: 44px;
  padding: 0 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 11px;
  margin-bottom: 10px;
  text-align: center;
}
#lock input:focus { border-color: color-mix(in srgb, var(--acc) 50%, var(--line)); }
#lockPass2 { display: none; }
#lockErr {
  min-height: 18px;
  margin: 0 0 12px;
  font-size: 13px;
  color: var(--danger);
}
.lock-btn {
  width: min(100%, 280px);
  height: 44px;
  background: var(--acc);
  color: #fff;
  border-radius: 11px;
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 8px;
}
.lock-btn:hover { filter: brightness(1.05); }
.lock-alt {
  color: var(--mut);
  font-size: 13px;
  height: 36px;
}

/* Settings */
#settings {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: var(--bg);
  display: none;
  flex-direction: column;
  transform: translateX(105%);
  transition: transform .28s var(--ease);
}
#settings.open {
  display: flex;
  transform: translateX(0);
}
.set-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: calc(var(--st) + 8px) 16px 12px;
  border-bottom: 1px solid var(--line);
}
.set-header h2 {
  margin: 0;
  font-size: 17px;
  font-weight: 650;
}
.set-body {
  flex: 1;
  overflow-y: auto;
  padding: 20px 20px calc(var(--sb) + 24px);
  width: min(100%, 480px);
  margin-inline: auto;
}
.set-group { margin-bottom: 28px; }
.set-group > label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--mut);
  text-transform: uppercase;
  letter-spacing: .04em;
  margin-bottom: 10px;
}
.set-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}
.set-row:last-child { border-bottom: 0; }
.set-row select {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 10px;
  font-size: 13px;
  min-width: 110px;
}
.hint {
  margin: 8px 0 0;
  font-size: 12px;
  color: var(--mut);
  line-height: 1.45;
}
.app-note {
  font-size: 13px;
  color: var(--mut);
  line-height: 1.45;
  margin-bottom: 12px;
}
.set-btn {
  width: 100%;
  height: 42px;
  margin-top: 8px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: 14px;
  font-weight: 550;
}
.set-btn:hover { background: var(--card-hover); }
.set-btn.danger {
  color: var(--danger);
  border-color: color-mix(in srgb, var(--danger) 25%, var(--line));
}
.set-btn.danger:hover { background: color-mix(in srgb, var(--danger) 8%, transparent); }

/* Toggle */
.toggle {
  width: 44px;
  height: 26px;
  border-radius: 13px;
  background: var(--line);
  position: relative;
  cursor: pointer;
  transition: background .2s;
  flex-shrink: 0;
}
.toggle::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  transition: transform .2s var(--ease);
  box-shadow: 0 1px 3px rgba(0,0,0,.12);
}
.toggle.on { background: var(--acc); }
.toggle.on::after { transform: translateX(18px); }

/* Install sheet */
#installGuide {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: rgba(0,0,0,.35);
  display: none;
  align-items: flex-end;
  justify-content: center;
}
#installGuide.show { display: flex; }
.sheet {
  background: var(--card);
  width: min(100%, 400px);
  border-radius: 18px 18px 0 0;
  padding: 12px 24px calc(var(--sb) + 20px);
  animation: sheetUp .3s var(--ease);
}
.sheet-handle {
  width: 36px;
  height: 4px;
  background: var(--line);
  border-radius: 2px;
  margin: 0 auto 16px;
}
.sheet h3 {
  margin: 0 0 14px;
  font-size: 17px;
  font-weight: 650;
}
.sheet ol {
  margin: 0 0 20px;
  padding-left: 20px;
  color: var(--mut);
  font-size: 14px;
  line-height: 1.65;
}
.guide-close {
  width: 100%;
  height: 44px;
  background: var(--acc);
  color: #fff;
  border-radius: 11px;
  font-weight: 600;
  font-size: 14px;
}

/* Toast */
.toast {
  position: fixed;
  bottom: calc(var(--sb) + 80px);
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--fg);
  color: var(--bg);
  padding: 10px 18px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  z-index: 90;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s, transform .25s;
  max-width: 90vw;
  text-align: center;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes sheetUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
</style>
</head>
<body>

<div id="lock">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  <h2 id="lockTitle">Notes are locked</h2>
  <p id="lockText"></p>
  <input id="lockPass" type="password" autocomplete="current-password" placeholder="Passphrase" aria-label="Passphrase">
  <input id="lockPass2" type="password" autocomplete="new-password" placeholder="Repeat passphrase" aria-label="Repeat passphrase">
  <p id="lockErr" role="alert"></p>
  <button class="lock-btn" id="lockOk">Unlock</button>
  <button class="lock-alt" id="lockCancel">Cancel</button>
</div>

<div id="settings">
  <div class="set-header">
    <button class="icon-btn" id="setBack" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h2>Settings</h2>
  </div>
  <div class="set-body">
    <div class="set-group">
      <label>Appearance</label>
      <div class="set-row">
        <span>Theme</span>
        <select id="themeMode" aria-label="Theme">
          <option value="system">System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
    </div>
    <div class="set-group">
      <label>Privacy & security</label>
      <div class="set-row">
        <span>Encrypt with passphrase</span>
        <div class="toggle" id="togLock" role="switch" aria-label="Encrypt with a passphrase" tabindex="0"></div>
      </div>
      <p class="hint">Notes stay on this device. If you forget the passphrase, notes cannot be recovered.</p>
      <div class="set-row" id="rowAuto" style="display:none">
        <span>Lock after</span>
        <select id="selAuto" aria-label="Automatic lock">
          <option value="0">Immediately</option>
          <option value="1">1 minute</option>
          <option value="5">5 minutes</option>
          <option value="30">30 minutes</option>
        </select>
      </div>
      <button class="set-btn" id="btnChangePass" style="display:none">Change passphrase</button>
      <button class="set-btn" id="btnLockNow" style="display:none">Lock now</button>
    </div>
    <div class="set-group">
      <label>Storage</label>
      <div class="app-note">Stored locally on this device. No account. No tracking.</div>
      <button class="set-btn danger" id="btnClearAll">Delete all notes</button>
    </div>
    <div class="set-group">
      <label>App</label>
      <button class="set-btn" id="btnInstall">Install ioNote</button>
    </div>
  </div>
</div>

<header class="header" id="header">
  <div class="header-inner">
    <div class="header-row">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <path d="M14 2v6h6M8 13h8M8 17h5"/>
          </svg>
        </div>
        <h1>ioNote</h1>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btnSettings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="search-wrap" id="searchWrap">
      <input id="q" type="search" placeholder="Search notes" autocomplete="off" enterkeyhint="search" spellcheck="false" aria-label="Search notes">
      <span class="search-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
      </span>
      <button class="search-clear" id="qClear" aria-label="Clear search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<div class="toolbar">
  <button class="chip active" data-filter="all">All</button>
  <button class="chip" data-filter="pinned">Pinned</button>
  <span class="count" id="count"></span>
</div>

<main id="list"></main>

<button class="fab" id="add" aria-label="Create a new note">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M12 5v14M5 12h14"/>
  </svg>
</button>

<section id="ed">
  <div class="ed-header">
    <button id="back" aria-label="Back to notes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" width="20" height="20">
        <path d="m15 18-6-6 6-6"/>
      </svg>
    </button>
    <span class="save-status" id="saveStatus"></span>
    <button id="btnPin" aria-label="Pin note" title="Pin note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
        <path d="M12 17v5M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1z"/>
      </svg>
    </button>
  </div>
  <input id="t" placeholder="Untitled" dir="auto" autocomplete="off" spellcheck="true" aria-label="Note title">
  <textarea id="b" placeholder="Start writing…" dir="auto" spellcheck="true" aria-label="Note text"></textarea>
  <div class="ed-footer">
    <span class="word-count" id="wordCount"></span>
    <button class="btn-danger" id="del">Delete</button>
  </div>
</section>

<div id="installGuide">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3 id="guideTitle">Install ioNote</h3>
    <ol id="guideSteps"></ol>
    <button class="guide-close" id="guideClose">Done</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";

const STORE_KEY = "notes_v3_enc";
const SETTINGS_KEY = "notes_settings_v3";
const ITER = 600000;
const CHECK = "ionote";

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

/* ── Crypto helpers (AES-GCM + PBKDF2) ── */
const te = new TextEncoder();
const td = new TextDecoder();

function b64(buf) {
  const bytes = buf instanceof ArrayBuffer ? new Uint8Array(buf) : buf;
  let s = "";
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s);
}
function fromB64(str) {
  const bin = atob(str);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function deriveKey(pass, salt, iter = ITER) {
  const base = await crypto.subtle.importKey("raw", te.encode(pass.normalize("NFKC")), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: iter, hash: "SHA-256" },
    base,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}

async function encryptText(plain, key) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, te.encode(plain));
  return b64(iv) + ":" + b64(ct);
}

async function decryptText(payload, key) {
  const [ivB, ctB] = payload.split(":");
  if (!ivB || !ctB) throw new Error("bad payload");
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(ivB) }, key, fromB64(ctB));
  return td.decode(pt);
}

async function checkKey(key, check) {
  try { return (await decryptText(check, key)) === CHECK; } catch { return false; }
}

async function decryptItems(items, key) {
  const out = [];
  for (const n of items) {
    try {
      const title = n.t ? await decryptText(n.t, key) : "";
      const body = n.b ? await decryptText(n.b, key) : "";
      out.push({ ...n, title, body, t: undefined, b: undefined });
    } catch { /* skip corrupt */ }
  }
  return out;
}

function loadRaw(key, fallback) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  } catch { return fallback; }
}

function saveRaw(key, val) {
  localStorage.setItem(key, JSON.stringify(val));
}

/* ── State ── */
let notes = [];
let settings = loadRaw(SETTINGS_KEY, { theme: "system", lock: false, auto: 5 });
let cryptoKey = null;
let salt = null;
let checkPayload = null;
let currentId = null;
let filter = "all";
let saveTimer = null;
let autoLockTimer = null;
let dirty = false;

/* ── Theme ── */
function applyTheme() {
  document.documentElement.setAttribute("data-theme", settings.theme || "system");
  const meta = document.querySelectorAll('meta[name="theme-color"]');
  // handled by media queries
}
applyTheme();

/* ── UI helpers ── */
function toast(msg, ms = 2400) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), ms);
}

function formatDate(ts) {
  const d = new Date(ts);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return "Just now";
  if (diff < 3600) return Math.floor(diff / 60) + "m ago";
  if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
  if (diff < 604800) return Math.floor(diff / 86400) + "d ago";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function wordCount(text) {
  const w = (text || "").trim().split(/\s+/).filter(Boolean).length;
  return w ? w + (w === 1 ? " word" : " words") : "";
}

/* ── Render list ── */
function renderList() {
  const q = ($("#q").value || "").trim().toLowerCase();
  let list = notes.slice();

  if (filter === "pinned") list = list.filter(n => n.pin);
  if (q) {
    list = list.filter(n =>
      (n.title || "").toLowerCase().includes(q) ||
      (n.body || "").toLowerCase().includes(q)
    );
  }

  list.sort((a, b) => {
    if (a.pin !== b.pin) return a.pin ? -1 : 1;
    return (b.updated || b.created) - (a.updated || a.created);
  });

  $("#count").textContent = list.length ? list.length + (list.length === 1 ? " note" : " notes") : "";

  const main = $("#list");
  if (!list.length) {
    main.innerHTML = `
      <div id="empty">
        <div class="empty-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <path d="M14 2v6h6M8 13h8M8 17h5"/>
          </svg>
        </div>
        <p>${q ? "No matching notes" : "No notes yet"}</p>
        <span>${q ? "Try a different search" : "Tap + to create your first note"}</span>
      </div>`;
    return;
  }

  main.innerHTML = list.map((n, i) => `
    <article class="note${n.pin ? " pinned" : ""}" data-id="${n.id}" style="animation-delay:${Math.min(i * 30, 180)}ms">
      <span class="note-title">${esc(n.title || "Untitled")}</span>
      <p class="note-preview">${esc((n.body || "").slice(0, 160))}</p>
      <div class="note-meta">
        ${n.pin ? '<span class="pin-indicator">Pinned</span><span>·</span>' : ""}
        <span>${formatDate(n.updated || n.created)}</span>
      </div>
    </article>
  `).join("");
}

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/* ── Persistence ── */
async function persist() {
  if (settings.lock && cryptoKey) {
    const items = [];
    for (const n of notes) {
      items.push({
        id: n.id,
        pin: !!n.pin,
        created: n.created,
        updated: n.updated,
        t: await encryptText(n.title || "", cryptoKey),
        b: await encryptText(n.body || "", cryptoKey)
      });
    }
    saveRaw(STORE_KEY, { salt: b64(salt), check: checkPayload, items });
  } else {
    saveRaw(STORE_KEY, {
      items: notes.map(n => ({
        id: n.id,
        title: n.title,
        body: n.body,
        pin: !!n.pin,
        created: n.created,
        updated: n.updated
      }))
    });
  }
}

async function loadNotes() {
  const raw = loadRaw(STORE_KEY, null);
  if (!raw) { notes = []; return; }

  if (raw.salt && raw.check) {
    // Encrypted store
    salt = fromB64(raw.salt);
    checkPayload = raw.check;
    settings.lock = true;
    showLock("unlock");
    return;
  }

  notes = (raw.items || []).map(n => ({
    id: n.id,
    title: n.title || "",
    body: n.body || "",
    pin: !!n.pin,
    created: n.created || Date.now(),
    updated: n.updated || n.created || Date.now()
  }));
  renderList();
}

/* ── Lock UI ── */
function showLock(mode) {
  const el = $("#lock");
  el.classList.add("show");
  $("#lockPass").value = "";
  $("#lockPass2").value = "";
  $("#lockPass2").style.display = mode === "setup" || mode === "change" ? "block" : "none";
  $("#lockErr").textContent = "";
  $("#lockCancel").style.display = mode === "unlock" ? "none" : "block";

  if (mode === "setup") {
    $("#lockTitle").textContent = "Set a passphrase";
    $("#lockText").textContent = "This encrypts your notes on this device. Remember it — it cannot be recovered.";
    $("#lockOk").textContent = "Enable encryption";
  } else if (mode === "change") {
    $("#lockTitle").textContent = "Change passphrase";
    $("#lockText").textContent = "Enter a new passphrase. Your notes will be re-encrypted.";
    $("#lockOk").textContent = "Update";
  } else {
    $("#lockTitle").textContent = "Notes are locked";
    $("#lockText").textContent = "Enter your passphrase to unlock.";
    $("#lockOk").textContent = "Unlock";
  }
  el.dataset.mode = mode;
  setTimeout(() => $("#lockPass").focus(), 80);
}

function hideLock() {
  $("#lock").classList.remove("show");
}

async function handleLockOk() {
  const mode = $("#lock").dataset.mode;
  const p1 = $("#lockPass").value;
  const p2 = $("#lockPass2").value;
  $("#lockErr").textContent = "";

  if (!p1) {
    $("#lockErr").textContent = "Enter a passphrase";
    return;
  }

  if (mode === "setup" || mode === "change") {
    if (p1 !== p2) {
      $("#lockErr").textContent = "Passphrases do not match";
      return;
    }
    if (p1.length < 4) {
      $("#lockErr").textContent = "Use at least 4 characters";
      return;
    }

    salt = crypto.getRandomValues(new Uint8Array(16));
    cryptoKey = await deriveKey(p1, salt);
    checkPayload = await encryptText(CHECK, cryptoKey);
    settings.lock = true;
    saveRaw(SETTINGS_KEY, settings);
    await persist();
    hideLock();
    updateSettingsUI();
    toast("Encryption enabled");
    resetAutoLock();
    return;
  }

  // Unlock
  try {
    const key = await deriveKey(p1, salt);
    if (!(await checkKey(key, checkPayload))) {
      $("#lockErr").textContent = "Incorrect passphrase";
      return;
    }
    cryptoKey = key;
    const raw = loadRaw(STORE_KEY, {});
    notes = await decryptItems(raw.items || [], key);
    hideLock();
    renderList();
    resetAutoLock();
  } catch {
    $("#lockErr").textContent = "Incorrect passphrase";
  }
}

/* ── Editor ── */
function openNote(id) {
  const n = notes.find(x => x.id === id);
  if (!n) return;
  currentId = id;
  dirty = false;
  $("#t").value = n.title || "";
  $("#b").value = n.body || "";
  $("#wordCount").textContent = wordCount(n.body);
  $("#saveStatus").textContent = "";
  $("#saveStatus").className = "save-status";
  updatePinBtn(n.pin);
  $("#ed").classList.add("open");
  setTimeout(() => {
    if (!(n.title || n.body)) $("#t").focus();
  }, 280);
}

function closeEditor() {
  if (dirty) saveCurrent(true);
  $("#ed").classList.remove("open");
  currentId = null;
}

function updatePinBtn(pinned) {
  const btn = $("#btnPin");
  btn.style.color = pinned ? "var(--acc)" : "";
  btn.setAttribute("aria-label", pinned ? "Unpin note" : "Pin note");
}

function saveCurrent(force) {
  if (!currentId) return;
  const n = notes.find(x => x.id === currentId);
  if (!n) return;
  const title = $("#t").value;
  const body = $("#b").value;
  if (!force && title === (n.title || "") && body === (n.body || "")) return;

  n.title = title;
  n.body = body;
  n.updated = Date.now();
  dirty = false;
  $("#saveStatus").textContent = "Saving…";
  $("#saveStatus").className = "save-status saving";

  persist().then(() => {
    $("#saveStatus").textContent = "Saved";
    $("#saveStatus").className = "save-status saved";
    setTimeout(() => {
      if ($("#saveStatus").textContent === "Saved") {
        $("#saveStatus").textContent = "";
        $("#saveStatus").className = "save-status";
      }
    }, 1600);
    renderList();
  });
}

function scheduleSave() {
  dirty = true;
  $("#wordCount").textContent = wordCount($("#b").value);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveCurrent(), 600);
}

/* ── Auto lock ── */
function resetAutoLock() {
  clearTimeout(autoLockTimer);
  if (!settings.lock || !cryptoKey) return;
  const mins = Number(settings.auto) || 0;
  if (mins <= 0) return;
  autoLockTimer = setTimeout(() => {
    cryptoKey = null;
    notes = [];
    renderList();
    showLock("unlock");
  }, mins * 60 * 1000);
}

/* ── Settings UI ── */
function updateSettingsUI() {
  $("#themeMode").value = settings.theme || "system";
  const locked = !!settings.lock;
  $("#togLock").classList.toggle("on", locked);
  $("#togLock").setAttribute("aria-checked", locked);
  $("#rowAuto").style.display = locked ? "flex" : "none";
  $("#btnChangePass").style.display = locked ? "block" : "none";
  $("#btnLockNow").style.display = locked ? "block" : "none";
  $("#selAuto").value = String(settings.auto ?? 5);
}

/* ── Events ── */
$("#add").addEventListener("click", () => {
  const id = crypto.randomUUID();
  const n = { id, title: "", body: "", pin: false, created: Date.now(), updated: Date.now() };
  notes.unshift(n);
  persist();
  renderList();
  openNote(id);
});

$("#list").addEventListener("click", e => {
  const card = e.target.closest(".note");
  if (card) openNote(card.dataset.id);
});

$("#back").addEventListener("click", closeEditor);

$("#t").addEventListener("input", scheduleSave);
$("#b").addEventListener("input", scheduleSave);

$("#btnPin").addEventListener("click", () => {
  if (!currentId) return;
  const n = notes.find(x => x.id === currentId);
  if (!n) return;
  n.pin = !n.pin;
  n.updated = Date.now();
  updatePinBtn(n.pin);
  persist();
  renderList();
});

$("#del").addEventListener("click", () => {
  if (!currentId) return;
  if (!confirm("Delete this note?")) return;
  notes = notes.filter(n => n.id !== currentId);
  persist();
  renderList();
  closeEditor();
  toast("Note deleted");
});

$("#q").addEventListener("input", () => {
  $("#searchWrap").classList.toggle("has-query", !!$("#q").value);
  renderList();
});
$("#qClear").addEventListener("click", () => {
  $("#q").value = "";
  $("#searchWrap").classList.remove("has-query");
  renderList();
  $("#q").focus();
});

$$(".chip").forEach(c => {
  c.addEventListener("click", () => {
    $$(".chip").forEach(x => x.classList.remove("active"));
    c.classList.add("active");
    filter = c.dataset.filter;
    renderList();
  });
});

$("#btnSettings").addEventListener("click", () => {
  updateSettingsUI();
  $("#settings").classList.add("open");
});
$("#setBack").addEventListener("click", () => {
  $("#settings").classList.remove("open");
});

$("#themeMode").addEventListener("change", () => {
  settings.theme = $("#themeMode").value;
  saveRaw(SETTINGS_KEY, settings);
  applyTheme();
});

$("#togLock").addEventListener("click", () => {
  if (settings.lock) {
    if (!confirm("Turn off encryption? Notes will be stored unencrypted on this device.")) return;
    settings.lock = false;
    cryptoKey = null;
    salt = null;
    checkPayload = null;
    saveRaw(SETTINGS_KEY, settings);
    persist();
    updateSettingsUI();
    toast("Encryption disabled");
  } else {
    showLock("setup");
  }
});
$("#togLock").addEventListener("keydown", e => {
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); $("#togLock").click(); }
});

$("#selAuto").addEventListener("change", () => {
  settings.auto = Number($("#selAuto").value);
  saveRaw(SETTINGS_KEY, settings);
  resetAutoLock();
});

$("#btnChangePass").addEventListener("click", () => showLock("change"));
$("#btnLockNow").addEventListener("click", () => {
  cryptoKey = null;
  notes = [];
  renderList();
  $("#settings").classList.remove("open");
  showLock("unlock");
});

$("#btnClearAll").addEventListener("click", () => {
  if (!confirm("Delete all notes permanently?")) return;
  notes = [];
  persist();
  renderList();
  $("#settings").classList.remove("open");
  toast("All notes deleted");
});

$("#lockOk").addEventListener("click", handleLockOk);
$("#lockPass").addEventListener("keydown", e => { if (e.key === "Enter") handleLockOk(); });
$("#lockPass2").addEventListener("keydown", e => { if (e.key === "Enter") handleLockOk(); });
$("#lockCancel").addEventListener("click", hideLock);

/* Install */
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  deferredPrompt = e;
});

$("#btnInstall").addEventListener("click", async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    return;
  }
  // Show manual guide
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const isAndroid = /Android/.test(navigator.userAgent);
  $("#guideTitle").textContent = "Install ioNote";
  if (isIOS) {
    $("#guideSteps").innerHTML = `
      <li>Tap the Share button</li>
      <li>Scroll and tap <strong>Add to Home Screen</strong></li>
      <li>Tap Add</li>`;
  } else if (isAndroid) {
    $("#guideSteps").innerHTML = `
      <li>Open the browser menu (⋮)</li>
      <li>Tap <strong>Install app</strong> or <strong>Add to Home screen</strong></li>`;
  } else {
    $("#guideSteps").innerHTML = `
      <li>Look for the install icon in the address bar</li>
      <li>Or open the browser menu and choose Install</li>`;
  }
  $("#installGuide").classList.add("show");
});
$("#guideClose").addEventListener("click", () => $("#installGuide").classList.remove("show"));
$("#installGuide").addEventListener("click", e => {
  if (e.target === $("#installGuide")) $("#installGuide").classList.remove("show");
});

/* Scroll header */
const header = $("#header");
window.addEventListener("scroll", () => {
  header.classList.toggle("scrolled", window.scrollY > 8);
}, { passive: true });

/* Activity for auto-lock */
["pointerdown", "keydown", "scroll"].forEach(ev => {
  document.addEventListener(ev, () => resetAutoLock(), { passive: true });
});

/* Service worker */
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}

/* Boot */
updateSettingsUI();
loadNotes().then(() => {
  if (!settings.lock) renderList();
});

// First-run toast
if (!localStorage.getItem("ionote_seen")) {
  localStorage.setItem("ionote_seen", "1");
  setTimeout(() => toast("Your notes are saved on this device.", 4000), 600);
}
})();
</script>
</body>
</html>
